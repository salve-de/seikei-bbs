<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>議員 | 政経フォーラム</title>
    <meta name="description" content="議員に紐づく議論と一次情報" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="site-header-main">
          <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-copy">
              <span class="brand-kicker">Political Economy Forum</span>
              <strong>政経フォーラム</strong>
            </span>
          </a>
          <nav class="primary-nav" aria-label="主要ページ">
            <a class="nav-link" href="/">今日の争点</a>
            <a class="nav-link is-active" href="/politicians">議員</a>
            <a class="nav-link" href="/new">新規スレ</a>
            <a class="nav-link" href="/moderation">モデレーション</a>
          </nav>
        </div>
        <div id="roomTabs" class="room-strip" aria-label="部屋一覧"></div>
      </header>

      <main class="page">
        <nav class="breadcrumb" aria-label="パンくず">
          <a href="/">ホーム</a><span>/</span><a href="/politicians">議員</a>
        </nav>

        <section class="entity-board-head">
          <div><p class="eyebrow">Politician board</p><h1 id="politicianBoardTitle">議員について語る</h1><p id="politicianBoardMeta"></p></div>
          <a id="politicianNewThread" class="button button-primary" href="/new">この議員でスレを立てる</a>
        </section>

        <section class="panel">
            <div class="section-head">
              <h2>動いているスレ</h2>
              <span id="politicianThreadCount" class="count-label">0</span>
            </div>
            <div id="politicianThreads" class="conversation-feed"></div>
        </section>

        <details class="profile-details"><summary>公式プロフィールを確認</summary><section id="politicianProfile" class="politician-profile"></section></details>
      </main>
    </div>

    <script src="/shared.js"></script>
    <script src="/politician.js"></script>
  </body>
</html>
