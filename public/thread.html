<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>論点 | 政経フォーラム</title><link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header"><div class="site-header-main"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-copy"><span class="brand-kicker">Political Economy Forum</span><strong>政経フォーラム</strong></span></a><nav class="primary-nav"><a class="nav-link" href="/">掲示板</a><a class="nav-link" href="/politicians">議員</a><a class="nav-link" href="/new">スレを立てる</a></nav></div><div id="roomTabs" class="room-strip"></div></header>
      <main class="page thread-page">
        <nav id="threadBreadcrumb" class="breadcrumb"></nav>
        <article class="thread-lead">
          <div class="thread-lead-main"><div id="threadBadges" class="inline-row"></div><h1 id="threadTitle">論点</h1><p id="threadSummary"></p><div id="threadMeta" class="meta-strip"></div></div>
          <div class="thread-lead-actions"><button id="watchButton" class="watch-button watch-button-large" type="button" title="あとで追う" aria-label="あとで追う">☆</button><button id="reportThreadButton" class="button button-muted" type="button">通報</button></div>
        </article>
        <section id="threadSource" class="source-block"></section>

        <div class="conversation-layout">
          <section class="conversation-panel">
            <div class="conversation-head"><div><p class="eyebrow">Live thread</p><h2>この話題の会話</h2></div><span id="discussionSummary" class="conversation-count"></span></div>
            <div id="conversationFilter" class="conversation-filter"></div>
            <div id="commentList" class="comment-list"></div>
          </section>

          <aside class="discussion-composer">
            <form id="commentForm" class="composer-panel">
              <div><p class="eyebrow">Join</p><h2>書き込む</h2></div>
              <div id="replyContext" class="reply-context" hidden></div>
              <label class="field composer-body"><span>本文</span><textarea id="commentBody" rows="8" maxlength="2000" placeholder="思ったことを、そのまま書く" required></textarea></label>
              <details class="composer-details">
                <summary>立場・名前・出典を追加</summary>
                <div class="composer-options">
                  <label class="field"><span>立場</span><select id="commentStance"><option value="">選ばない</option></select></label>
                  <label class="field"><span>投稿の種類</span><select id="commentClaimType"><option value="">選ばない</option></select></label>
                  <label class="field"><span>名前</span><input id="commentAuthor" maxlength="32" placeholder="名無しさん" /></label>
                  <label class="field"><span>出典URL</span><input id="commentSource" type="url" placeholder="任意" /></label>
                  <fieldset class="field"><legend>関係する分野</legend><div id="commentImpacts" class="check-grid"></div></fieldset>
                </div>
              </details>
              <p id="commentFeedback" class="form-feedback" hidden></p>
              <button id="commentSubmit" class="button button-primary" type="submit">投稿する</button>
            </form>
          </aside>
        </div>

        <section id="relatedSection" class="panel" hidden><div class="section-head"><h2>関連する論点</h2></div><div id="relatedThreads" class="flat-list"></div></section>
      </main>
    </div>

    <dialog id="reportDialog" class="modal-shell"><form id="reportForm" class="modal-card" method="dialog"><div class="section-head"><h2 id="reportTitle">通報</h2><button class="icon-button" type="button" id="closeReport" aria-label="閉じる">×</button></div><div class="form-grid"><label class="field"><span>名前</span><input id="reporterName" maxlength="32" placeholder="匿名通報" /></label><label class="field"><span>理由</span><select id="reportReason"><option>誹謗中傷</option><option>個人攻撃</option><option>デマ</option><option>スパム</option><option>荒らし</option><option>その他</option></select></label><label class="field field-full"><span>詳細</span><textarea id="reportDetails" rows="4" maxlength="400"></textarea></label></div><p id="reportFeedback" class="form-feedback" hidden></p><div class="form-actions"><button class="button button-primary" type="submit">送信</button></div></form></dialog>
    <script src="/shared.js"></script><script src="/thread.js"></script>
  </body>
</html>
