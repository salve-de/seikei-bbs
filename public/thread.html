<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>会場 | 政経板</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/crowd.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="site-header-main">
          <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-copy"><strong>政経板</strong></span></a>
          <nav class="primary-nav" aria-label="主要ページ">
            <a class="nav-link" href="/">盛り上がり</a>
            <a class="nav-link" href="/politicians">人物</a>
            <a class="nav-link" href="/new">会場を作る</a>
          </nav>
        </div>
        <div id="roomTabs" class="room-strip" aria-label="板を選ぶ"></div>
      </header>

      <main class="page thread-page">
        <nav id="threadBreadcrumb" class="breadcrumb"></nav>
        <article class="thread-lead">
          <div class="thread-lead-main">
            <div id="threadBadges" class="inline-row"></div>
            <h1 id="threadTitle">会場</h1>
            <p id="threadSummary"></p>
            <div id="threadMeta" class="meta-strip"></div>
          </div>
          <div class="thread-lead-actions">
            <button id="watchButton" class="watch-button watch-button-large" type="button" title="続きを追う" aria-label="続きを追う">☆</button>
            <button id="reportThreadButton" class="button button-muted" type="button">通報</button>
          </div>
        </article>

        <details class="fuel-details" open>
          <summary>元ネタ・最初の投稿</summary>
          <section id="threadSource" class="source-block"></section>
        </details>

        <div class="conversation-layout">
          <section class="conversation-panel">
            <div class="conversation-head">
              <div><h2 id="conversationTitle">書き込み</h2></div>
              <span id="discussionSummary" class="conversation-count"></span>
            </div>
            <div id="conversationFilter" class="conversation-filter"></div>
            <div id="commentList" class="comment-list"></div>
          </section>

          <aside class="discussion-composer">
            <form id="commentForm" class="composer-panel">
              <div><h2>書き込む</h2></div>
              <div id="replyContext" class="reply-context" hidden></div>
              <label class="field composer-body"><span>本文</span><textarea id="commentBody" rows="8" maxlength="2000" placeholder="思ったことを書く" required></textarea></label>
              <details class="composer-details">
                <summary>立場・名前・出典を追加する</summary>
                <div class="composer-options">
                  <label class="field"><span>立場</span><select id="commentStance"><option value="">選ばない</option></select></label>
                  <label class="field"><span>投稿の種類</span><select id="commentClaimType"><option value="">選ばない</option></select></label>
                  <label class="field"><span>名前</span><input id="commentAuthor" maxlength="32" placeholder="空欄なら名無しさん" /></label>
                  <label class="field"><span>出典URL</span><input id="commentSource" type="url" placeholder="任意" /></label>
                  <fieldset class="field"><legend>関係する分野</legend><div id="commentImpacts" class="check-grid"></div></fieldset>
                </div>
              </details>
              <p id="commentFeedback" class="form-feedback" hidden></p>
              <button id="commentSubmit" class="button button-primary" type="submit">投稿する</button>
            </form>
          </aside>
        </div>

        <section id="relatedSection" class="panel" hidden>
          <div class="section-head"><h2>関連する会場</h2></div>
          <div id="relatedThreads" class="flat-list"></div>
        </section>
      </main>
    </div>

    <dialog id="reportDialog" class="modal-shell">
      <form id="reportForm" class="modal-card" method="dialog">
        <div class="section-head"><h2 id="reportTitle">通報</h2><button class="icon-button" type="button" id="closeReport" aria-label="閉じる">×</button></div>
        <div class="form-grid">
          <label class="field"><span>名前</span><input id="reporterName" maxlength="32" placeholder="匿名通報" /></label>
          <label class="field"><span>理由</span><select id="reportReason"><option>誹謗中傷</option><option>個人攻撃</option><option>デマ</option><option>スパム</option><option>荒らし</option><option>その他</option></select></label>
          <label class="field field-full"><span>詳細</span><textarea id="reportDetails" rows="4" maxlength="400"></textarea></label>
        </div>
        <p id="reportFeedback" class="form-feedback" hidden></p>
        <div class="form-actions"><button class="button button-primary" type="submit">送信</button></div>
      </form>
    </dialog>

    <script src="/shared.js"></script>
    <script src="/thread.js"></script>
  </body>
</html>
