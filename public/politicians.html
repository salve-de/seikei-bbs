<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>議員から探す | 政経板</title>
    <meta name="description" content="議員に紐づく政治経済の議論を探す" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="site-header-main">
          <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-copy"><strong>政経板</strong></span>
          </a>
          <nav class="primary-nav" aria-label="主要ページ">
            <a class="nav-link" href="/">掲示板</a>
            <a class="nav-link is-active" href="/politicians">議員</a>
            <a class="nav-link" href="/new">新規スレ</a>
          </nav>
        </div>
        <div id="roomTabs" class="room-strip" aria-label="部屋一覧"></div>
      </header>

      <main class="page">
        <section class="directory-head">
          <div>
            <h1>議員から探す</h1>
          </div>
          <div class="directory-tools">
            <label class="field search-field">
              <span>氏名・会派・選挙区</span>
              <input id="politicianSearch" type="search" autocomplete="off" />
            </label>
            <span id="politicianCount" class="count-label">0人</span>
          </div>
        </section>

        <div id="politicianGrid" class="politician-grid"></div>

      </main>
    </div>

    <script src="/shared.js"></script>
    <script src="/politicians.js"></script>
  </body>
</html>
