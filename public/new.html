<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>スレッドを立てる | 政経板</title>
    <meta name="description" content="政治経済について匿名スレッドを作成" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/crowd.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="site-header-main">
          <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-copy"><strong>政経板</strong></span>
          </a>
          <nav class="primary-nav" aria-label="主要ページ">
            <a class="nav-link" href="/">時事・盛り上がり</a>
            <a class="nav-link" href="/politicians">政治家</a>
            <a class="nav-link" href="/topics.html">政策・テーマ</a>
            <a class="nav-link is-active" href="/new">スレッドを立てる</a>
          </nav>
        </div>
        <div id="roomTabs" class="room-strip" aria-label="板を選ぶ"></div>
      </header>

      <main class="page">
        <section class="panel">
          <div class="section-head"><h1>スレッドを立てる</h1></div>

          <form id="composerForm" class="form-stack">
            <div class="form-grid thread-composer-core">
              <label class="field">
                <span>板</span>
                <select id="composerRoom"></select>
              </label>

              <label class="field field-full">
                <span>タイトル</span>
                <input id="composerTitle" type="text" minlength="4" maxlength="120" required placeholder="何について話す？" />
              </label>

              <label class="field field-full">
                <span>本文</span>
                <textarea id="composerBody" rows="10" minlength="2" maxlength="4000" required placeholder="内容を書く"></textarea>
              </label>
            </div>

            <details class="composer-details">
              <summary>詳細を追加する</summary>
              <div class="form-grid composer-options">
                <label class="field"><span>名前</span><input id="composerAuthor" type="text" maxlength="32" placeholder="空欄なら名無しさん" /></label>
                <label class="field"><span>会話モード</span><select id="composerMode"><option value="mixed">ごちゃ混ぜ</option><option value="same-side">同じ側で話す</option><option value="opposition-welcome">反対意見歓迎</option></select></label>
                <label class="field"><span>関連する対象</span><select id="composerTargetType"></select></label>
                <label id="composerPoliticianField" class="field"><span>議員</span><select id="composerTargetId"></select></label>
                <label id="composerTargetLabelField" class="field field-full"><span>政策・政党・企業・地域・指標名</span><input id="composerTargetLabel" type="text" maxlength="60" /></label>
                <label class="field field-full"><span>補足</span><textarea id="composerSummary" rows="2" maxlength="240"></textarea></label>
                <label class="field field-full"><span>問い</span><input id="composerDecisionPrompt" type="text" maxlength="180" /></label>
                <fieldset class="field field-full"><legend>関係する分野</legend><div id="composerImpacts" class="check-grid"></div></fieldset>
                <label class="field"><span>タグ</span><input id="composerTags" type="text" /></label>
                <label class="field"><span>URL</span><input id="composerSourceUrl" type="url" /></label>
                <label class="field"><span>URLの種類</span><select id="composerSourceKind"><option value="other">その他</option><option value="official">公的機関・一次資料</option><option value="news">報道</option><option value="analysis">解説・分析</option></select></label>
                <label class="checkbox-line field-full"><input id="composerMegathread" type="checkbox" /><span>継続スレにする</span></label>
              </div>
            </details>

            <p id="composerFeedback" class="form-feedback" hidden></p>

            <div class="form-actions">
              <a class="button button-muted" href="/">戻る</a>
              <button class="button button-primary" type="submit">作成する</button>
            </div>
          </form>
        </section>

        <section id="duplicateSection" class="panel" hidden>
          <div class="section-head"><h2>似たスレッド</h2></div>
          <div id="duplicateList" class="flat-list"></div>
        </section>
      </main>
    </div>

    <script src="/shared.js"></script>
    <script src="/new-thread.js"></script>
  </body>
</html>
