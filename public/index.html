<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>政経板 | 政治経済の匿名掲示板</title>
    <meta name="description" content="政治・経済について匿名で話せる掲示板" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/crowd.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="site-header-main">
          <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-copy"><strong>政経板</strong></span>
          </a>
          <nav class="primary-nav" aria-label="主要ページ">
            <a class="nav-link is-active" href="/">盛り上がり</a>
            <a class="nav-link" href="/politicians">人物</a>
            <a class="nav-link" href="/new">会場を作る</a>
          </nav>
        </div>
        <div id="roomTabs" class="room-strip" aria-label="板を選ぶ"></div>
      </header>

      <main class="page">
        <section class="crowd-intro" aria-labelledby="crowdTitle">
          <div class="crowd-intro-copy">
            <h1 id="crowdTitle">今、どこが沸いてる？</h1>
          </div>

          <form id="quickPostForm" class="quick-post-card">
            <div class="quick-post-head">
              <div><h2>投稿する</h2></div>
              <a href="/new">詳細</a>
            </div>

            <div class="quick-kind-row" aria-label="投稿の種類">
              <label><input type="radio" name="quickKind" value="一言" checked /><span>一言</span></label>
              <label><input type="radio" name="quickKind" value="質問" /><span>質問</span></label>
              <label><input type="radio" name="quickKind" value="予想" /><span>予想</span></label>
              <label><input type="radio" name="quickKind" value="資料投下" /><span>URL・資料</span></label>
              <label><input type="radio" name="quickKind" value="実況" /><span>実況</span></label>
            </div>

            <label class="sr-only" for="quickBody">投稿内容</label>
            <textarea id="quickBody" maxlength="2000" required placeholder="今、言いたいことを書く"></textarea>
            <div class="quick-post-options">
              <label>
                <span class="sr-only">投稿先</span>
                <select id="quickRoom" aria-label="投稿先の板"></select>
              </label>
              <label>
                <span class="sr-only">元情報URL</span>
                <input id="quickSource" type="url" placeholder="URL（任意）" />
              </label>
            </div>
            <p id="quickPostFeedback" class="form-feedback" hidden></p>
            <div class="quick-post-actions">
              <button id="quickSubmit" class="button button-primary quick-submit" type="submit">会場を作る</button>
            </div>
          </form>
        </section>

        <section class="arena-section" aria-labelledby="hotArenaTitle">
          <div class="arena-section-head">
            <div><h2 id="hotArenaTitle">今、沸いている会場</h2></div>
          </div>
          <div id="hotArenas" class="hot-arena-grid"></div>
        </section>

        <nav id="boardSwitch" class="board-switch" aria-label="話題の範囲"></nav>

        <div class="forum-layout">
          <section class="forum-feed">
            <div class="feed-toolbar">
              <div id="feedTabs" class="segmented-control compact" aria-label="並び順"></div>
              <span id="homeCounts" class="section-note"></span>
            </div>
            <div id="threadFeed" class="conversation-feed"></div>
          </section>

          <aside class="forum-sidebar">
            <section class="panel">
              <div class="section-head"><h2>人物</h2></div>
              <div id="featuredPoliticians" class="politician-list"></div>
            </section>
            <section class="panel">
              <div class="section-head"><h2>テーマ</h2></div>
              <div id="roomDirectory"></div>
            </section>
          </aside>
        </div>
      </main>
    </div>

    <script src="/shared.js"></script>
    <script src="/home.js"></script>
  </body>
</html>
