<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>政治と経済の匿名掲示板 | 政経フォーラム</title>
    <meta name="description" content="議員、政策、政治、経済について匿名で語る掲示板" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="site-header-main">
          <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-copy"><span class="brand-kicker">Political Economy Forum</span><strong>政経フォーラム</strong></span>
          </a>
          <nav class="primary-nav" aria-label="主要ページ">
            <a class="nav-link is-active" href="/">掲示板</a>
            <a class="nav-link" href="/politicians">議員</a>
            <a class="nav-link" href="/new">スレを立てる</a>
          </nav>
        </div>
        <div id="roomTabs" class="room-strip" aria-label="部屋一覧"></div>
      </header>

      <main class="page">
        <section class="board-intro">
          <div><p class="eyebrow">Anonymous political forum</p><h1>いま政治と経済で、何を言い合ってる？</h1></div>
          <a class="button button-primary" href="/new">スレを立てる</a>
        </section>

        <nav id="boardSwitch" class="board-switch" aria-label="板を選ぶ"></nav>

        <div class="forum-layout">
          <section class="forum-feed">
            <div class="feed-toolbar"><div id="feedTabs" class="segmented-control compact" aria-label="並び順"></div><span id="homeCounts" class="section-note"></span></div>
            <div id="threadFeed" class="conversation-feed"></div>
          </section>
          <aside class="forum-sidebar">
            <section class="panel"><div class="section-head"><h2>議員別の掲示板</h2></div><div id="featuredPoliticians" class="politician-list"></div></section>
            <section class="panel"><div class="section-head"><h2>細かいテーマ</h2></div><div id="roomDirectory"></div></section>
          </aside>
        </div>
      </main>

      <footer class="site-footer">
        <span>政治をタネに、本音で話す。</span>
        <span>脅迫、晒し、差別、執拗な個人攻撃は通報対象です。</span>
      </footer>
    </div>
    <script src="/shared.js"></script>
    <script src="/home.js"></script>
  </body>
</html>
